name: Release Go Module

# Releases are allowed only for commits on jay-bigtable-extended.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to create (e.g. v0.4.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  GOTOOLCHAIN: auto
  RELEASE_BRANCH: jay-bigtable-extended

jobs:
  validate:
    name: Validate Release Source
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve and validate release
        id: release
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          git fetch --no-tags origin \
            "+refs/heads/${RELEASE_BRANCH}:refs/remotes/origin/${RELEASE_BRANCH}"

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="$REQUESTED_VERSION"
            TARGET=$(git rev-parse "origin/${RELEASE_BRANCH}^{commit}")
          else
            TAG="$GITHUB_REF_NAME"
            TARGET=$(git rev-parse "${GITHUB_SHA}^{commit}")
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Version must match vX.Y.Z, got: $TAG"
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] &&
             git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "ERROR: Tag $TAG already exists"
            exit 1
          fi

          if ! git merge-base --is-ancestor "$TARGET" "origin/${RELEASE_BRANCH}"; then
            echo "ERROR: Commit $TARGET is not on ${RELEASE_BRANCH}"
            exit 1
          fi

          echo "Releasing $TAG from $TARGET on ${RELEASE_BRANCH}"
          echo "commit=$TARGET" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    needs: validate
    runs-on: ubuntu-latest
    container: golang:1.26
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - name: Build
        run: go build -buildvcs=false ./...

      - name: Fix git ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Test
        run: go test -buildvcs=false ./bttest/ -count=1 -timeout 180s -v

  tag:
    name: Tag
    needs: [validate, test]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0

      - name: Create tag
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          TARGET: ${{ needs.validate.outputs.commit }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$TAG" "$TARGET" \
            --message "Release $TAG from $RELEASE_BRANCH"
          git push origin "refs/tags/${TAG}"

  release:
    name: Create GitHub Release
    needs: [validate, test, tag]
    if: ${{ always() && needs.validate.result == 'success' && needs.test.result == 'success' && (github.event_name == 'push' || needs.tag.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0

      - name: Verify tag target
        env:
          EXPECTED: ${{ needs.validate.outputs.commit }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          ACTUAL=$(git rev-parse "refs/tags/${TAG}^{commit}")
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "ERROR: Tag $TAG points to $ACTUAL, expected $EXPECTED"
            exit 1
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          target_commitish: ${{ needs.validate.outputs.commit }}
          generate_release_notes: true

  verify-module:
    name: Verify Go Module
    needs: [validate, release]
    runs-on: ubuntu-latest
    container: golang:1.26
    steps:
      - name: Wait for module proxy
        run: sleep 30

      - name: Verify module is fetchable
        env:
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          echo "Verifying module at $TAG"
          GONOSUMCHECK='github.com/jhsenjaliya/*' \
          GONOSUMDB='github.com/jhsenjaliya/*' \
          GOPRIVATE='github.com/jhsenjaliya/*' \
            go list -m "github.com/jhsenjaliya/little_bigtable@${TAG}"
          echo "Module verified successfully"

  build-binaries:
    name: Build Binaries
    needs: [validate, release]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -buildvcs=false -trimpath -ldflags="-s -w" \
            -o little_bigtable-${{ matrix.goos }}-${{ matrix.goarch }} .

      - name: Upload binary to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          files: little_bigtable-${{ matrix.goos }}-${{ matrix.goarch }}
