name: Release Go Module

# Triggered manually or when a version tag is pushed.
# Creates a GitHub release and verifies the Go module is fetchable.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to create (e.g. v0.4.0)'
        required: true
        type: string
      branch:
        description: 'Branch to tag and release from (default: master)'
        required: false
        type: string
        default: 'master'

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    container: golang:1.26
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Install C compiler (required for go-sqlite3)
        run: apt-get update && apt-get install -y gcc

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./bttest/ -count=1 -timeout 120s -v

  tag-and-release:
    name: Tag & Release
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate version format
        run: |
          VERSION="${{ inputs.version }}"
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Version must match vX.Y.Z format, got: $VERSION"
            exit 1
          fi

      - name: Check tag doesn't exist
        run: |
          if git rev-parse "${{ inputs.version }}" >/dev/null 2>&1; then
            echo "ERROR: Tag ${{ inputs.version }} already exists"
            exit 1
          fi

      - name: Create tag on target branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="${{ inputs.branch || 'master' }}"
          echo "Tagging ${{ inputs.version }} on branch $BRANCH"
          git tag -a "${{ inputs.version }}" "origin/$BRANCH" \
            -m "Release ${{ inputs.version }} from $BRANCH"
          git push origin "${{ inputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          generate_release_notes: true

  verify-module:
    name: Verify Go Module
    needs: tag-and-release
    if: always() && (needs.tag-and-release.result == 'success' || github.event_name == 'push')
    runs-on: ubuntu-latest
    container: golang:1.26
    steps:
      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for module proxy
        run: sleep 30

      - name: Verify module is fetchable
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          echo "Verifying module at $TAG"
          GONOSUMCHECK=github.com/jhsenjaliya/* \
          GONOSUMDB=github.com/jhsenjaliya/* \
          GOPRIVATE=github.com/jhsenjaliya/* \
            go list -m "github.com/jhsenjaliya/little_bigtable@${TAG}"
          echo "Module verified successfully"

  build-binaries:
    name: Build Binaries
    needs: test
    if: github.event_name == 'push' || needs.tag-and-release.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install cross-compilation tools
        if: matrix.goos == 'linux'
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.goos == 'linux' && matrix.goarch == 'amd64' && '1' || '0' }}
        run: |
          go build -trimpath -ldflags="-s -w" \
            -o little_bigtable-${{ matrix.goos }}-${{ matrix.goarch }} .

      - name: Upload binary to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: little_bigtable-${{ matrix.goos }}-${{ matrix.goarch }}
