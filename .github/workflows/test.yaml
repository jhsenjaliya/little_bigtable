name: tests

on:
  push:         {branches: [jay-bigtable-extended]}
  pull_request: {branches: [jay-bigtable-extended]}

env:
  GOTOOLCHAIN: auto

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.26']
        goarch: ['amd64']

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        env:
          GOARCH: ${{ matrix.goarch }}
        run: go build -buildvcs=false ./...

      - name: Test
        env:
          GOARCH: ${{ matrix.goarch }}
        run: go test -buildvcs=false ./bttest/ -count=1 -timeout 180s -v
